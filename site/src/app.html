<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		%sveltekit.head%
		<script>
			try {
				var theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch (e) {}
			if (/[?&]society=[a-z]{3}(&|$)/i.test(location.search)) {
				document.documentElement.dataset.society = '';
			}
			if (/[?&]sample=(paper|attention)(&|$)/.test(location.search)) {
				document.documentElement.dataset.sample = '';
			}
			if (/[?&]scale=centered(&|$)/.test(location.search)) {
				document.documentElement.dataset.centered = '';
			}
		</script>
		<!-- Cloudflare Web Analytics -->
		<script
			type="module"
			src="https://static.cloudflareinsights.com/beacon.min.js"
			data-cf-beacon='{"token": "58ded44fdb764340973b62e1e32f48a6"}'
		></script>
		<!-- End Cloudflare Web Analytics -->
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
