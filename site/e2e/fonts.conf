<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- In the Playwright Linux image, system-ui and sans-serif fall back to a Chinese font
     (WenQuanYi Zen Hei). Visual regression screenshots and share images map them to Liberation
     Sans, which the image also carries, so they look like the site (scripts/in-docker.sh). -->
<fontconfig>
	<include ignore_missing="yes">/etc/fonts/fonts.conf</include>
	<alias binding="strong">
		<family>system-ui</family>
		<prefer><family>Liberation Sans</family></prefer>
	</alias>
	<alias binding="strong">
		<family>sans-serif</family>
		<prefer><family>Liberation Sans</family></prefer>
	</alias>
	<alias binding="strong">
		<family>sans</family>
		<prefer><family>Liberation Sans</family></prefer>
	</alias>
</fontconfig>
