name: CI

# Every pull request, and every deploy (deploy.yml calls this workflow first) (§8.4).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (Ruff, mypy, pytest, privacy scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tags after v7, so it is pinned by commit.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: mypy
        run: uv run mypy
      # Unit tests only: tests marked needs_raw need the OSF files, which CI never has.
      - name: pytest
        run: uv run pytest -m "not needs_raw"
      - name: Privacy scan of data/derived (DR-9, DR-16)
        run: uv run pipeline privacy-scan

  site:
    name: Site (lint, type-check, Vitest, build, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Lint (Prettier, ESLint)
        run: npm run lint
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Vitest
        run: npm run test:unit -- --run
      - name: Build
        run: npm run build
      - name: Check the build (HR-2, HR-3, HR-7, NFR-5, NFR-40)
        run: npm run check:build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke tests
        run: npm run test:e2e

  workflows:
    name: Workflow syntax (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
