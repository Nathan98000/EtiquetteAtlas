name: Deploy

# Pushes to main build the site and publish it to GitHub Pages (§8.1, §8.4). Pages "Source" must be
# set to "GitHub Actions" in the repository settings (docs/SETUP.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # The base path comes from site/site.config.js (HR-1). Setting the repository variable
      # CHANGE_MODULE to "off" deploys the site without the change module (R-6, decision 75).
      - name: Build
        run: npm run build
        env:
          CHANGE_MODULE: ${{ vars.CHANGE_MODULE }}
      - name: Check the build
        run: npm run check:build
        env:
          CHANGE_MODULE: ${{ vars.CHANGE_MODULE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
