# Reviewed reference data for society metadata (DR-15). Edit by hand; `pipeline build` stops if a
# code in the GSN files is missing here, or if `country` no longer matches the files' spelling.

# Display names, keyed on `code` (ISO 3166 alpha-3, plus XKX for Kosovo; TTO is the pooled
# Caribbean). `country` is the spelling in the GSN files. Names follow the authors where they
# relabel a society (SRS §4.4): "China" is shown as "Mainland China" and "Somalia" as
# "Somaliland", because its site is Hargeisa. `DRCongo` is only spaced out.
[societies]
