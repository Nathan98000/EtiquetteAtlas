# Map positions the GSN files lack (SRS §4.4). Every other society uses the files' country
# centroid (`Latitude_average`, `Longitude_average`).
[coordinates]
XKX = { lat = 42.6, lon = 20.9, source = "approximate geographic centre of Kosovo, added by hand" }

