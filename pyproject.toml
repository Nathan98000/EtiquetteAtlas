[project]
name = "etiquette-atlas-pipeline"
version = "0.1.0"
description = "Offline data pipeline for The Etiquette Atlas: download, validate, estimate and export GSN aggregates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "numpy>=2.5",
    "pandas>=3.1",
    "pandera>=0.34",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pandas-stubs>=3.0",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pipeline"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
# Typographic characters used throughout the SRS (en dash, minus sign, multiplication sign).
allowed-confusables = ["–", "−", "×"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pipeline", "tests"]

[[tool.mypy.overrides]]
module = ["pandera.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --tb=short: long tracebacks print each frame's arguments, which could include raw data (DR-16).
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short"]
markers = [
    "needs_raw: needs the pinned OSF files in data/raw/; skipped when they are absent",
]
